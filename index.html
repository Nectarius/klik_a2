<!DOCTYPE html>
<html lang="el" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <meta name="googlebot" content="notranslate">
  <title>ΚΛΙΚ Α2 – Greek Vocabulary Flashcards</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Glossary Data -->
  <script src="glossary_data.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=GFS+Didot&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    
    .greek-title {
      font-family: 'GFS Didot', serif, 'Plus Jakarta Sans';
    }

    /* Card flip 3D perspective */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="notranslate bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900" translate="no">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Greek Alphabet array for filtering
    const GREEK_ALPHABET = [
      'Α', 'Β', 'Γ', 'Δ', 'Ε', 'Ζ', 'Η', 'Θ', 'Ι', 'Κ', 'Λ', 'Μ',
      'Ν', 'Ξ', 'Ο', 'Π', 'Ρ', 'Σ', 'Τ', 'Υ', 'Φ', 'Χ', 'Ψ', 'Ω'
    ];

    // Helper to pronounce Greek text with Web Speech API
    function speakGreek(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      // Clean up text: take first word if multiple or remove notes in brackets
      const cleanText = text.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').split('=')[0].trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'el-GR';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // Helper to download content into a local file from the browser
    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
    }

    function App() {
      const allWords = window.GLOSSARY_DATA || [];

      // View state: 'home' | 'study' | 'summary'
      const [view, setView] = useState('home');

      // Setup options
      const [selectedLetter, setSelectedLetter] = useState('ALL');
      const [shuffleEnabled, setShuffleEnabled] = useState(false);
      const [batchSize, setBatchSize] = useState('ALL'); // 'ALL', 25, 50, 100
      const [promptLanguage, setPromptLanguage] = useState('greek'); // 'greek' (prompt with Greek) | 'english' (prompt with English)

      // Persistent Starred / Bookmarked words
      const [starredIds, setStarredIds] = useState(() => {
        try {
          return new Set(JSON.parse(localStorage.getItem('klik_a2_starred') || '[]'));
        } catch {
          return new Set();
        }
      });

      const toggleStar = (id) => {
        setStarredIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          try {
            localStorage.setItem('klik_a2_starred', JSON.stringify(Array.from(next)));
          } catch (e) {}
          return next;
        });
      };

      // Active study session state
      const [deck, setDeck] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({}); // { [wordId]: 'yes' | 'no' }
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionTitle, setSessionTitle] = useState('');
      const [copiedToast, setCopiedToast] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [showSaveMenu, setShowSaveMenu] = useState(false);
      const [autoPronounce, setAutoPronounce] = useState(false);

      // In-progress session auto-save & resume
      const [savedSession, setSavedSession] = useState(() => {
        try {
          const s = localStorage.getItem('klik_a2_active_session');
          return s ? JSON.parse(s) : null;
        } catch {
          return null;
        }
      });

      // Auto-save active session to localStorage
      useEffect(() => {
        if (view === 'study' && deck.length > 0) {
          try {
            const data = {
              deck,
              currentIndex,
              answers,
              sessionTitle,
              timestamp: Date.now()
            };
            localStorage.setItem('klik_a2_active_session', JSON.stringify(data));
            setSavedSession(data);
          } catch (e) {}
        } else if (view === 'summary') {
          try {
            localStorage.removeItem('klik_a2_active_session');
            setSavedSession(null);
          } catch (e) {}
        }
      }, [view, deck, currentIndex, answers, sessionTitle]);

      const resumeSavedSession = () => {
        if (!savedSession || !savedSession.deck) return;
        setDeck(savedSession.deck);
        setCurrentIndex(savedSession.currentIndex || 0);
        setAnswers(savedSession.answers || {});
        setSessionTitle(savedSession.sessionTitle || 'Resumed Session');
        setIsFlipped(false);
        setView('study');
      };

      const discardSavedSession = () => {
        try {
          localStorage.removeItem('klik_a2_active_session');
        } catch (e) {}
        setSavedSession(null);
      };

      // Review filter for forgotten words list
      const [forgottenSearch, setForgottenSearch] = useState('');

      // Letter word counts
      const letterCounts = useMemo(() => {
        const counts = {};
        allWords.forEach(w => {
          counts[w.letter] = (counts[w.letter] || 0) + 1;
        });
        return counts;
      }, [allWords]);

      // Start a session from configuration
      const startStudySession = (letter = selectedLetter, customWords = null, title = null) => {
        let list = [];
        if (customWords) {
          list = [...customWords];
        } else if (letter === 'ALL') {
          list = [...allWords];
        } else {
          list = allWords.filter(w => w.letter === letter);
        }

        if (shuffleEnabled && !customWords) {
          list.sort(() => Math.random() - 0.5);
        }

        if (batchSize !== 'ALL' && !customWords) {
          const limit = parseInt(batchSize, 10);
          if (!isNaN(limit)) {
            list = list.slice(0, limit);
          }
        }

        if (list.length === 0) {
          alert('No words found for this selection.');
          return;
        }

        setDeck(list);
        setCurrentIndex(0);
        setAnswers({});
        setIsFlipped(false);
        setSessionTitle(title || (letter === 'ALL' ? 'All Vocabulary (Α–Ω)' : `Letter ${letter} Vocabulary`));
        setView('study');
      };

      // Current active card
      const currentCard = deck[currentIndex];

      // Ensure English translation is always hidden when changing cards
      useEffect(() => {
        setIsFlipped(false);
      }, [currentIndex]);

      // Handle Yes: User remembered the word
      const handleRemembered = () => {
        if (!currentCard) return;
        setAnswers(prev => ({
          ...prev,
          [currentCard.id]: 'yes'
        }));
        goToNextCard();
      };

      // Handle No: User does NOT remember the word -> reveal English translation
      const handleForgotten = () => {
        if (!currentCard) return;
        setAnswers(prev => ({
          ...prev,
          [currentCard.id]: 'no'
        }));
        setIsFlipped(true); // reveals English translation
      };

      // Advance to next card or finish deck
      const goToNextCard = () => {
        if (currentIndex + 1 < deck.length) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        } else {
          // Finished all cards in deck
          setView('summary');
        }
      };

      // Summary statistics
      const summaryStats = useMemo(() => {
        const total = deck.length;
        let yesCount = 0;
        let noCount = 0;
        const forgottenList = [];
        const rememberedList = [];

        deck.forEach(item => {
          const ans = answers[item.id];
          if (ans === 'yes') {
            yesCount++;
            rememberedList.push(item);
          } else if (ans === 'no') {
            noCount++;
            forgottenList.push(item);
          }
        });

        const answeredTotal = yesCount + noCount;
        const percent = answeredTotal > 0 ? Math.round((yesCount / answeredTotal) * 100) : 0;

        return {
          total,
          answeredTotal,
          yesCount,
          noCount,
          percent,
          forgottenList,
          rememberedList
        };
      }, [deck, answers]);

      // Toast feedback helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      // Copy all unknown/forgotten words to clipboard
      const copyAllUnknownWords = () => {
        if (!summaryStats.forgottenList.length) return;
        const text = summaryStats.forgottenList.map(item => `${item.greek} = ${item.english}`).join('\n');
        navigator.clipboard.writeText(text);
        showToast(`✓ Copied ${summaryStats.forgottenList.length} unknown words to clipboard!`);
      };

      // Save unknown/forgotten words as .txt file (plain Greek = English)
      const saveUnknownWordsText = () => {
        if (!summaryStats.forgottenList.length) return;
        const dateStr = new Date().toISOString().slice(0, 10);
        const text = summaryStats.forgottenList.map(item => `${item.greek} = ${item.english}`).join('\n');
        downloadFile(text, `unknown_greek_words_${dateStr}.txt`, 'text/plain;charset=utf-8');
        showToast(`✓ Saved unknown_greek_words_${dateStr}.txt (${summaryStats.forgottenList.length} words)!`);
      };

      // Save unknown/forgotten words as .csv file (spreadsheet/Anki import)
      const saveUnknownWordsCSV = () => {
        if (!summaryStats.forgottenList.length) return;
        const dateStr = new Date().toISOString().slice(0, 10);
        const csvRows = [
          'Letter,Greek,English',
          ...summaryStats.forgottenList.map(item => 
            `"${item.letter}","${item.greek.replace(/"/g, '""')}","${item.english.replace(/"/g, '""')}"`
          )
        ];
        downloadFile(csvRows.join('\n'), `unknown_greek_words_${dateStr}.csv`, 'text/csv;charset=utf-8');
        showToast(`✓ Saved unknown_greek_words_${dateStr}.csv (${summaryStats.forgottenList.length} words)!`);
      };

      // Save unknown/forgotten words as structured JSON file
      const saveUnknownWordsJSON = () => {
        if (!summaryStats.forgottenList.length) return;
        const dateStr = new Date().toISOString().slice(0, 10);
        const jsonStr = JSON.stringify(summaryStats.forgottenList, null, 2);
        downloadFile(jsonStr, `unknown_greek_words_${dateStr}.json`, 'application/json;charset=utf-8');
        showToast(`✓ Saved unknown_greek_words_${dateStr}.json (${summaryStats.forgottenList.length} words)!`);
      };

      // Global keyboard navigation
      useEffect(() => {
        if (view !== 'study') return;

        const handleKeyDown = (e) => {
          // Ignore if focused on input
          if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

          if (isFlipped) {
            // User is reviewing the revealed English translation of a forgotten word
            if (e.code === 'Space' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
              e.preventDefault();
              goToNextCard();
            } else if (e.key === 'p' || e.key === 'P') {
              e.preventDefault();
              if (currentCard) speakGreek(currentCard.greek);
            }
          } else {
            // Initial state: Greek word shown
            if (e.key === 'y' || e.key === 'Y' || e.key === 'ArrowRight') {
              e.preventDefault();
              handleRemembered();
            } else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowLeft') {
              e.preventDefault();
              handleForgotten();
            } else if (e.code === 'Space') {
              e.preventDefault();
              handleForgotten();
            } else if (e.key === 'p' || e.key === 'P') {
              e.preventDefault();
              if (currentCard) speakGreek(currentCard.greek);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view, isFlipped, currentCard, currentIndex, deck, answers]);

      // Filtered forgotten list for review
      const filteredForgotten = useMemo(() => {
        if (!forgottenSearch.trim()) return summaryStats.forgottenList;
        const q = forgottenSearch.toLowerCase().trim();
        return summaryStats.forgottenList.filter(item => 
          item.greek.toLowerCase().includes(q) || item.english.toLowerCase().includes(q)
        );
      }, [summaryStats.forgottenList, forgottenSearch]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => setView('home')}
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
                  Κ
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 tracking-tight text-lg leading-tight flex items-center gap-2">
                    <span>ΚΛΙΚ στα ελληνικά</span>
                    <span className="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">Α2</span>
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">Greek-English Vocabulary Flashcards ({allWords.length} words)</p>
                </div>
              </div>

              {view === 'study' && (
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setView('summary')}
                    className="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-1.5"
                    title="End study session now and view results"
                  >
                    <span>Finish Early</span>
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* Main Body Content */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

            {/* VIEW 1: HOME / DECK SELECTION */}
            {view === 'home' && (
              <div className="max-w-3xl mx-auto w-full py-4 sm:py-8 space-y-8 animate-fadeIn">
                {/* Hero Banner */}
                <div className="text-center space-y-3">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                    <span className="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                    Interactive Vocabulary Practice
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    Master Greek A2 Vocabulary
                  </h2>
                  <p className="text-slate-600 text-sm sm:text-base max-w-xl mx-auto">
                    Practice with <strong>1,704</strong> authentic words and phrases extracted from the official <em>ΚΛΙΚ στα ελληνικά Α2</em> glossary. Track your recall and review forgotten words.
                  </p>
                </div>

                {/* Quick Start Card */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                      <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                      Study Configuration
                    </h3>
                    <span className="text-xs text-slate-500 font-medium">Configure session</span>
                  </div>

                  {/* Options Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Session Length
                      </label>
                      <select
                        value={batchSize}
                        onChange={(e) => setBatchSize(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="ALL">All Available Words (Full Deck)</option>
                        <option value="25">Quick Sprint (25 Words)</option>
                        <option value="50">Medium Session (50 Words)</option>
                        <option value="100">Deep Practice (100 Words)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Card Order
                      </label>
                      <button
                        type="button"
                        onClick={() => setShuffleEnabled(prev => !prev)}
                        className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl border text-sm font-semibold transition-all ${
                          shuffleEnabled 
                            ? 'bg-blue-50 border-blue-300 text-blue-800 shadow-xs' 
                            : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                        }`}
                      >
                        <span className="flex items-center gap-2">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                          Random Shuffle
                        </span>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${shuffleEnabled ? 'bg-blue-200 text-blue-900' : 'bg-slate-200 text-slate-600'}`}>
                          {shuffleEnabled ? 'ON' : 'OFF'}
                        </span>
                      </button>
                    </div>
                  </div>

                  {/* Big Primary Start Button & Starred Deck button */}
                  <div className="pt-2 space-y-3">
                    <button
                      onClick={() => startStudySession('ALL')}
                      className="w-full py-4 px-6 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white rounded-xl font-bold text-base shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                    >
                      <span>Start Studying All Words</span>
                      <span className="text-blue-200 text-sm font-normal">({batchSize === 'ALL' ? allWords.length : Math.min(parseInt(batchSize, 10), allWords.length)} words)</span>
                      <svg className="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>

                    {starredIds.size > 0 && (
                      <button
                        type="button"
                        onClick={() => {
                          const starredList = allWords.filter(w => starredIds.has(w.id));
                          startStudySession(null, starredList, `Starred / Bookmarked Words (${starredList.length} words)`);
                        }}
                        className="w-full py-3 px-5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2"
                      >
                        <svg className="w-4 h-4 fill-amber-500 text-amber-500" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <span>Study Starred Words ({starredIds.size} saved)</span>
                      </button>
                    )}
                  </div>
                </div>

                {/* Filter by Greek Letter */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-base font-bold text-slate-900">Study by Alphabet Letter</h3>
                      <p className="text-xs text-slate-500">Pick any Greek letter to practice targeted vocabulary</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2.5 pt-2">
                    {GREEK_ALPHABET.map(letter => {
                      const count = letterCounts[letter] || 0;
                      return (
                        <button
                          key={letter}
                          onClick={() => startStudySession(letter)}
                          className="flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 hover:shadow-xs transition-all group text-center"
                        >
                          <span className="text-xl font-black text-slate-800 group-hover:text-blue-600 font-serif">
                            {letter}
                          </span>
                          <span className="text-[11px] font-semibold text-slate-400 group-hover:text-blue-500 mt-0.5">
                            {count} words
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: ACTIVE FLASHCARD STUDY SESSION */}
            {view === 'study' && currentCard && (
              <div className="max-w-2xl mx-auto w-full py-4 space-y-6 animate-fadeIn">
                
                {/* Session Header / Progress */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs font-semibold text-slate-500">
                    <span className="flex items-center gap-1.5 font-bold text-slate-700">
                      <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                      {sessionTitle}
                    </span>
                    <span>
                      Card <strong>{currentIndex + 1}</strong> of {deck.length} ({Math.round(((currentIndex + 1) / deck.length) * 100)}%)
                    </span>
                  </div>

                  {/* Progress Bar */}
                  <div className="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div 
                      className="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-out"
                      style={{ width: `${((currentIndex + 1) / deck.length) * 100}%` }}
                    ></div>
                  </div>

                  {/* Live Mini Counters */}
                  <div className="flex items-center justify-between pt-1">
                    <div className="flex items-center gap-3 text-xs font-bold">

                    <div className="divide-y divide-slate-100 max-h-[500px] overflow-y-auto pr-2">
                      {filteredForgotten.map((item, idx) => (
                        <div key={item.id} className="py-3.5 flex items-start justify-between gap-4 group hover:bg-slate-50/80 rounded-xl px-2.5 transition-colors">
                          <div className="flex items-start gap-3">
                            <span className="w-6 h-6 rounded-md bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">
                              {item.letter}
                            </span>
                            <div>
                              <div className="text-base font-bold text-slate-900 flex items-center gap-2">
                                <span>{item.greek}</span>
                                <button
                                  type="button"
                                  onClick={() => speakGreek(item.greek)}
                                  className="text-slate-400 hover:text-blue-600 transition-colors p-0.5"
                                  title="Pronounce"
                                >
                                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                                </button>
                              </div>
                              <div className="text-xs text-slate-600 font-medium mt-0.5">
                                {item.english}
                              </div>
                            </div>
                          </div>

                          <span className="text-[11px] font-semibold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200 shrink-0">
                            Forgotten
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-bold flex items-center gap-2.5 animate-fadeIn">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{toastMessage}</span>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white py-4 mt-auto">
            <div className="max-w-5xl mx-auto px-4 text-center text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>
                Source: <span className="font-semibold text-slate-600">ΚΛΙΚ στα ελληνικά – Επίπεδο Α2 (Κέντρο Ελληνικής Γλώσσας)</span>
              </div>
              <div>
                Total 1,704 words • Offline Ready React Flashcard App
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
